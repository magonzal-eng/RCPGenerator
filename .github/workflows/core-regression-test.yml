name: Core regression tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "python_code/python/**"
      - ".github/workflows/core-regression-test.yml"

permissions:
  contents: read

jobs:
  core-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install cmake ninja pybind11

      - name: Configure regression tests
        working-directory: python_code/python
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_PARITY_TESTS=ON
          -DRCP_NATIVE_OPTIMIZATION=OFF
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Build regression tests
        working-directory: python_code/python
        run: cmake --build build --parallel 2

      - name: Run regression tests
        working-directory: python_code/python
        env:
          OMP_NUM_THREADS: "1"
        run: ctest --test-dir build --output-on-failure
